<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Counter poster · Groom Studio Gents Salon</title>
  <link rel="icon" href="images/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=Figtree:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap">
  <style>
    /* Printable A5 counter poster. Print with "Margins: none" and "Background graphics" on.
       QR codes are static inline SVG, generated locally with segno (see README). */
    @page { size: A5 portrait; margin: 0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; }
    body { background: #D5D7CC; font-family: "Figtree", Arial, sans-serif; color: #25272A; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .toolbar { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; padding: 20px 16px 0; }
    .toolbar button { font: 500 15px "Figtree", Arial, sans-serif; padding: 0 24px; min-height: 44px; border: 0; border-radius: 999px; background: #55653A; color: #fff; cursor: pointer; }
    .toolbar a { font: 500 15px "Figtree", Arial, sans-serif; color: #55653A; align-self: center; min-height: 44px; display: inline-flex; align-items: center; }
    .sheet {
      width: 148mm; height: 210mm; margin: 20px auto 40px; background: #F4F3EE;
      padding: 13mm 13mm 11mm; display: flex; flex-direction: column; align-items: center; text-align: center;
      position: relative; box-shadow: 0 20px 60px rgba(0,0,0,.18); overflow: hidden;
      font-variant-numeric: lining-nums;
    }
    .logo { width: 19mm; height: 19mm; position: relative; }
    .name { margin: 3.5mm 0 0; font: 600 13mm/1 "Familjen Grotesk", Arial, sans-serif; position: relative; }
    .sub { margin: 2.2mm 0 0; font: 500 2.7mm "Figtree", Arial, sans-serif; letter-spacing: .3em; text-transform: uppercase; color: #55653A; position: relative; }
    .ar-name { margin: 1.6mm 0 0; font: 600 4mm/1.4 "IBM Plex Sans Arabic", sans-serif; color: #55653A; position: relative; }
    .rule { width: 18mm; height: 0; border-top: 0.35mm solid #55653A; margin: 4.5mm 0 4mm; position: relative; }
    .cta { margin: 0; font: 600 6.2mm/1.15 "Familjen Grotesk", Arial, sans-serif; color: #55653A; position: relative; }
    .cta-ar { margin: 1.6mm 0 0; font: 500 4mm/1.45 "IBM Plex Sans Arabic", sans-serif; color: #5E625C; position: relative; }
    .qr-box { margin-top: 4.5mm; padding: 2.5mm; background: #fff; border: 0.3mm solid #DCDDD3; border-radius: 1.5mm; position: relative; }
    .qr { display: block; width: 54mm; height: 54mm; }
    .phone { margin: 4.5mm 0 0; font: 500 8.4mm/1 "Figtree", Arial, sans-serif; letter-spacing: .02em; font-variant-numeric: lining-nums tabular-nums; position: relative; }
    .phone-label { margin: 1.6mm 0 0; font: 500 2.6mm "Figtree", Arial, sans-serif; letter-spacing: .24em; text-transform: uppercase; color: #55653A; position: relative; }
    .foot {
      margin-top: auto; width: 100%; display: flex; align-items: center; gap: 4mm; text-align: start;
      padding-top: 3.5mm; border-top: 0.25mm solid #DCDDD3; position: relative;
    }
    .qr-small { display: block; width: 19mm; height: 19mm; flex: none; background: #fff; padding: 1.2mm; box-sizing: content-box; border: 0.25mm solid #DCDDD3; }
    .foot p { margin: 0; font: 400 2.85mm/1.45 "Figtree", Arial, sans-serif; color: #5E625C; }
    .foot b { font-weight: 600; color: #25272A; }
    .name { letter-spacing: -.04em; }
    .logo { border-radius: 5mm; }
    .qr-box { border-radius: 5mm; border: 0; box-shadow: 0 0 0 3mm #E3E6D8; }
    .rule { width: 12mm; border-top-width: 1.2mm; border-radius: 1mm; }
    .foot { border-top: 0; background: #E3E6D8; border-radius: 4mm; padding: 3mm 4mm; }
    .qr-small { border-radius: 2mm; border: 0; }
    @media print {
      body { background: none; }
      .toolbar { display: none; }
      .sheet { margin: 0; box-shadow: none; }
    }
    @media screen and (max-width: 600px) {
      .sheet { zoom: .62; }
    }
  </style>
</head>
